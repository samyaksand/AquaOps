<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1200" height="770" fill="#ffffff"/>

  <!-- ============ SECTION 1: DECISION-SUPPORT WORKFLOW ============ -->
  <text x="40" y="38" font-size="20" font-weight="700" fill="#0f172a">Decision-support workflow</text>
  <text x="40" y="58" font-size="13" fill="#64748b">How an operator moves from a question to a comparable, evidence-based decision</text>

  <!-- Row of workflow boxes -->
  <g font-size="13" font-weight="600">
    <!-- Operator -->
    <rect x="40" y="85" width="150" height="56" rx="10" fill="#0f172a"/>
    <text x="115" y="118" text-anchor="middle" fill="#ffffff">Operator</text>

    <!-- Scenario Configuration -->
    <rect x="230" y="85" width="170" height="56" rx="10" fill="#0e7490" />
    <text x="315" y="112" text-anchor="middle" fill="#ffffff">Scenario</text>
    <text x="315" y="128" text-anchor="middle" fill="#ffffff">Configuration</text>

    <!-- Allocation Strategy -->
    <rect x="440" y="85" width="170" height="56" rx="10" fill="#0e7490"/>
    <text x="525" y="112" text-anchor="middle" fill="#ffffff">Allocation</text>
    <text x="525" y="128" text-anchor="middle" fill="#ffffff">Strategy</text>

    <!-- Allocation Engine -->
    <rect x="650" y="85" width="170" height="56" rx="10" fill="#115e59"/>
    <text x="735" y="112" text-anchor="middle" fill="#ffffff">Allocation</text>
    <text x="735" y="128" text-anchor="middle" fill="#ffffff">Engine</text>

    <!-- Network + Flow Results -->
    <rect x="860" y="85" width="190" height="56" rx="10" fill="#115e59"/>
    <text x="955" y="112" text-anchor="middle" fill="#ffffff">Network &amp; Flow</text>
    <text x="955" y="128" text-anchor="middle" fill="#ffffff">Results</text>
  </g>

  <!-- arrows row 1 -->
  <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <line x1="190" y1="113" x2="226" y2="113"/>
    <line x1="400" y1="113" x2="436" y2="113"/>
    <line x1="610" y1="113" x2="646" y2="113"/>
    <line x1="820" y1="113" x2="856" y2="113"/>
  </g>

  <!-- down from Network results to row 2 -->
  <path d="M 955 141 L 955 180 L 735 180 L 735 205" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: Before/After -> Pareto -> Decision Support -->
  <g font-size="13" font-weight="600">
    <rect x="440" y="211" width="190" height="56" rx="10" fill="#0e7490"/>
    <text x="535" y="238" text-anchor="middle" fill="#ffffff">Before / After</text>
    <text x="535" y="254" text-anchor="middle" fill="#ffffff">Comparison</text>

    <rect x="660" y="211" width="220" height="56" rx="10" fill="#0e7490"/>
    <text x="770" y="238" text-anchor="middle" fill="#ffffff">Pareto Frontier /</text>
    <text x="770" y="254" text-anchor="middle" fill="#ffffff">Trade-off Analysis</text>

    <rect x="910" y="211" width="220" height="56" rx="10" fill="#0f172a"/>
    <text x="1020" y="238" text-anchor="middle" fill="#ffffff">Decision Support</text>
    <text x="1020" y="254" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="400">operator decides</text>
  </g>

  <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <line x1="630" y1="239" x2="656" y2="239"/>
    <line x1="880" y1="239" x2="906" y2="239"/>
  </g>

  <!-- loop back: Decision Support -> Scenario Configuration (iterate) -->
  <path d="M 1020 267 L 1020 300 L 315 300 L 315 145" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="667" y="294" text-anchor="middle" font-size="11.5" fill="#64748b" font-style="italic">operator tries another scenario</text>

  <rect x="40" y="340" width="1120" height="1" fill="#e2e8f0"/>

  <!-- ============ SECTION 2: TECHNICAL ARCHITECTURE ============ -->
  <text x="40" y="378" font-size="20" font-weight="700" fill="#0f172a">Technical architecture</text>
  <text x="40" y="398" font-size="13" fill="#64748b">What actually computes and serves the workflow above</text>

  <!-- Application layer -->
  <g>
    <rect x="40" y="420" width="230" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="155" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">React + TypeScript</text>
    <text x="155" y="467" text-anchor="middle" font-size="11.5" fill="#64748b">Vite, Tailwind v4, zustand</text>
  </g>

  <path d="M 270 455 L 300 455" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="300" y="420" width="230" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="415" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">FastAPI</text>
    <text x="415" y="467" text-anchor="middle" font-size="11.5" fill="#64748b">HTTP + WebSocket, pure domain core</text>
  </g>

  <path d="M 530 455 L 560 455" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="560" y="420" width="290" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="705" y="442" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Redis · Kafka · WebSockets</text>
    <text x="705" y="460" text-anchor="middle" font-size="11.5" fill="#64748b">realtime relay, best-effort cache/fanout</text>
    <text x="705" y="476" text-anchor="middle" font-size="11.5" fill="#64748b">(worker process bridges Kafka → Redis pub/sub)</text>
  </g>

  <path d="M 850 455 L 880 455" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="880" y="420" width="280" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1020" y="442" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">PostgreSQL + PostGIS</text>
    <text x="1020" y="460" text-anchor="middle" font-size="11.5" fill="#64748b">Supabase in production</text>
    <text x="1020" y="476" text-anchor="middle" font-size="11.5" fill="#64748b">source of truth for the network</text>
  </g>

  <!-- Infrastructure / Deployment layer, visually separated -->
  <text x="40" y="540" font-size="13.5" font-weight="700" fill="#334155">Infrastructure &amp; deployment</text>

  <g font-size="12" font-weight="600">
    <rect x="40" y="555" width="170" height="54" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="125" y="587" text-anchor="middle" fill="#334155">Docker Compose</text>

    <rect x="230" y="555" width="170" height="54" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="315" y="587" text-anchor="middle" fill="#334155">Kubernetes</text>

    <rect x="420" y="555" width="170" height="54" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="505" y="587" text-anchor="middle" fill="#334155">Helm</text>

    <rect x="610" y="555" width="170" height="54" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="695" y="587" text-anchor="middle" fill="#334155">Nginx (frontend)</text>

    <rect x="800" y="555" width="170" height="54" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="885" y="587" text-anchor="middle" fill="#334155">OVHcloud VPS</text>

    <rect x="990" y="555" width="170" height="54" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="1075" y="580" text-anchor="middle" fill="#334155">Cloudflare</text>
    <text x="1075" y="596" text-anchor="middle" fill="#64748b" font-size="10" font-weight="400">DNS / TLS</text>
  </g>

  <text x="40" y="640" font-size="11.5" fill="#94a3b8" font-style="italic">
    Prometheus + Grafana + OpenTelemetry are wired into the Kubernetes/Helm path only — not part of the single-VPS Compose production deploy.
  </text>

  <rect x="40" y="665" width="1120" height="1" fill="#e2e8f0"/>

  <!-- Legend -->
  <g font-size="11.5" fill="#64748b">
    <rect x="40" y="690" width="14" height="14" rx="3" fill="#0e7490"/>
    <text x="60" y="701">Decision-support workflow step</text>

    <rect x="260" y="690" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="280" y="701">Application component (always running)</text>

    <rect x="560" y="690" width="14" height="14" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="3 3"/>
    <text x="580" y="701">Infrastructure / deployment target</text>
  </g>

  <text x="40" y="745" font-size="11" fill="#94a3b8">
    AquaOps is a simulated decision-support prototype. It computes allocation and trade-off results for a human operator; it does not act on infrastructure or decide autonomously.
  </text>
</svg>
