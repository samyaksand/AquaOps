# Mirrors the Vite dev server's proxy: the SPA always calls `/api/...`
# (relative paths), nginx forwards it to the backend Service, and WebSocket
# upgrade headers are passed through so `/api/v1/ws` works the same way.
# `Connection` must only say "upgrade" for an actual upgrade request, or
# ordinary HTTP keep-alive on the same location breaks.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;

    location /api/ {
        proxy_pass http://aquaops-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
