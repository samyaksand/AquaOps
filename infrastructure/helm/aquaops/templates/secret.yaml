# Local-development credentials only — see infrastructure/kubernetes/secret.yaml.
# Not a real secret; override .Values.secrets.postgresPassword for anything
# beyond local use.
apiVersion: v1
kind: Secret
metadata:
  name: aquaops-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
