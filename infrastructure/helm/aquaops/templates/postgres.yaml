apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aquaops-postgres-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.postgres.storageClassName }}
  storageClassName: {{ .Values.postgres.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aquaops-postgres
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  # Single-writer storage (ReadWriteOnce PVC): never roll more than one pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aquaops-postgres
  template:
    metadata:
      labels:
        app: aquaops-postgres
        {{- include "aquaops.labels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: {{ .Values.postgres.port }}
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: aquaops-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: aquaops-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aquaops-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.config.POSTGRES_USER }}", "-d", "{{ .Values.config.POSTGRES_DB }}"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.config.POSTGRES_USER }}", "-d", "{{ .Values.config.POSTGRES_DB }}"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aquaops-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: aquaops-postgres
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: aquaops-postgres
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
