{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: aquaops-grafana-datasources
  namespace: {{ .Values.namespace }}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://aquaops-prometheus:{{ .Values.observability.prometheus.port }}
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aquaops-grafana-dashboard-provider
  namespace: {{ .Values.namespace }}
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: aquaops
        type: file
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aquaops-grafana-dashboards
  namespace: {{ .Values.namespace }}
data:
  aquaops-overview.json: |
{{ .Files.Get "dashboards/aquaops-overview.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aquaops-grafana
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aquaops-grafana
  template:
    metadata:
      labels:
        app: aquaops-grafana
        {{- include "aquaops.labels" . | nindent 8 }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.observability.grafana.image }}
          ports:
            - containerPort: {{ .Values.observability.grafana.port }}
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.observability.grafana.adminPassword | quote }}
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.observability.grafana.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.observability.grafana.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.observability.grafana.resources | nindent 12 }}
      volumes:
        - name: datasources
          configMap:
            name: aquaops-grafana-datasources
        - name: dashboard-provider
          configMap:
            name: aquaops-grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: aquaops-grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: aquaops-grafana
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.observability.grafana.service.type }}
  selector:
    app: aquaops-grafana
  ports:
    - port: {{ .Values.observability.grafana.port }}
      targetPort: {{ .Values.observability.grafana.port }}
      {{- if eq .Values.observability.grafana.service.type "NodePort" }}
      nodePort: {{ .Values.observability.grafana.service.nodePort }}
      {{- end }}
{{- end }}
