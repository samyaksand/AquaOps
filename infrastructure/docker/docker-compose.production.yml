# AquaOps — production Docker Compose (lightweight deploy).
#
# Runs on a single small VPS. PostgreSQL/PostGIS is NOT run here — Supabase
# is the production database, reached over DATABASE_URL like any other
# Postgres. Redis still runs on the VM: it is best-effort infrastructure the
# backend already degrades without (see backend/app/core/config.py /
# CLAUDE.md "Events & Cache"), so there is no managed-service dependency to
# introduce for it.
#
# Kafka is deliberately NOT started here. It stays fully implemented in the
# codebase (app/events/, app/worker.py) and still runs in local dev
# (infrastructure/docker/docker-compose.yml) and the Kubernetes/Helm path —
# this is only a smaller, cheaper footprint for a lightweight/portfolio VPS
# deploy. Pair this with KAFKA_ENABLED=false in backend/.env.production: the
# backend already treats Kafka as best-effort (it degrades to "no live
# relay" instead of failing a request — see CLAUDE.md "Events & Cache"), and
# the worker idles cleanly instead of connecting when Kafka is disabled (see
# app/worker.py). To restore the full event-relay pipeline on this same
# Compose file, add the `kafka` service back (see docker-compose.yml for a
# working definition), add it to `backend`/`worker`'s `depends_on`, and set
# KAFKA_ENABLED=true.
#
# All credentials/URLs come from an external env file passed with --env-file
# (see infrastructure/docker/PRODUCTION.md) — nothing here is hardcoded.
#
# Frontend/nginx is the single public origin: it serves the built SPA and
# reverse-proxies /api/ (including the /api/v1/ws WebSocket upgrade) to the
# backend, so Cloudflare only ever needs to point at one origin/port
# (frontend:8080). This mirrors frontend/nginx.conf and the Kubernetes
# frontend Service, unchanged from the existing dev Compose/K8s setup.

services:
  redis:
    image: redis:7-alpine
    container_name: aquaops-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aquaops
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: aquaops-backend:production
    container_name: aquaops-backend
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - ../../backend/.env.production
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - aquaops
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: aquaops-backend:production
    container_name: aquaops-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file:
      - ../../backend/.env.production
    depends_on:
      redis:
        condition: service_healthy
    # No HTTP surface to probe (see infrastructure/kubernetes/worker.yaml) —
    # restart: unless-stopped plus Docker's own process liveness covers it.
    networks:
      - aquaops
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        # Both are optional — left unset, the SPA calls relative /api paths
        # and nginx below reverse-proxies them to the backend container on
        # this same origin, which is the default and recommended setup
        # behind a single Cloudflare-fronted domain. Set only if the
        # frontend and backend are ever split across different origins.
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
        VITE_WS_BASE_URL: "${VITE_WS_BASE_URL:-}"
    image: aquaops-frontend:production
    container_name: aquaops-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aquaops
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

networks:
  aquaops:
    name: aquaops-production
