# Non-secret configuration, mirroring infrastructure/docker/docker-compose.yml.
# Values here match app/core/config.py's Settings field names (case-insensitive
# env lookup), so no code changes were needed to run under Kubernetes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aquaops-config
  namespace: aquaops
data:
  ENVIRONMENT: "kubernetes"
  DEBUG: "false"
  CORS_ORIGINS: '["http://localhost:8080","http://aquaops-frontend:8080"]'
  DATABASE_URL: "postgresql+asyncpg://aquaops:aquaops@aquaops-postgres:5432/aquaops"
  REDIS_URL: "redis://aquaops-redis:6379/0"
  KAFKA_BOOTSTRAP_SERVERS: "aquaops-kafka:9092"
  KAFKA_ENABLED: "true"
  POSTGRES_DB: "aquaops"
  POSTGRES_USER: "aquaops"
