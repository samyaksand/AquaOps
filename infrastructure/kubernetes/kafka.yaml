# Single KRaft broker, mirroring infrastructure/docker/docker-compose.yml.
# KAFKA_ADVERTISED_LISTENERS uses the in-cluster Service DNS name so the
# backend/worker pods (and Kafka itself) all resolve the same broker address.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aquaops-kafka
  namespace: aquaops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aquaops-kafka
  template:
    metadata:
      labels:
        app: aquaops-kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:19093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://aquaops-kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:19093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
          readinessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aquaops-kafka
  namespace: aquaops
spec:
  selector:
    app: aquaops-kafka
  ports:
    - port: 9092
      targetPort: 9092
