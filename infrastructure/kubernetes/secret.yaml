# Local-development credentials only — plaintext values matching
# docker-compose.yml, committed here only because they are not real secrets
# (same password AquaOps already uses for local Postgres). A real deployment
# would generate these and keep them out of version control.
apiVersion: v1
kind: Secret
metadata:
  name: aquaops-secrets
  namespace: aquaops
type: Opaque
stringData:
  POSTGRES_PASSWORD: "aquaops"
