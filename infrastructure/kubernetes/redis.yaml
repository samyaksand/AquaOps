apiVersion: apps/v1
kind: Deployment
metadata:
  name: aquaops-redis
  namespace: aquaops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aquaops-redis
  template:
    metadata:
      labels:
        app: aquaops-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aquaops-redis
  namespace: aquaops
spec:
  selector:
    app: aquaops-redis
  ports:
    - port: 6379
      targetPort: 6379
