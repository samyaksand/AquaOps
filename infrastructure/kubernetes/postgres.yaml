apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aquaops-postgres-pvc
  namespace: aquaops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aquaops-postgres
  namespace: aquaops
spec:
  replicas: 1
  # Single-writer storage (ReadWriteOnce PVC): never roll more than one pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aquaops-postgres
  template:
    metadata:
      labels:
        app: aquaops-postgres
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: aquaops-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: aquaops-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aquaops-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              # postgres requires an empty mount point; postgis images are
              # fine with a subPath so the PVC root stays usable if reused.
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aquaops", "-d", "aquaops"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "aquaops", "-d", "aquaops"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aquaops-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: aquaops-postgres
  namespace: aquaops
spec:
  selector:
    app: aquaops-postgres
  ports:
    - port: 5432
      targetPort: 5432
